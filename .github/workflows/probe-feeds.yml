name: Feed-Kandidaten testen (temporaer)

on:
  push:
    branches: [development]
    paths: [probe_feeds.py, .github/workflows/probe-feeds.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python probe_feeds.py
