name: Themenradar aktualisieren

on:
  workflow_dispatch:        # manuell oder per Button aus der App
  schedule:
    - cron: '30 4 * * 1-5'  # werktags ca. 06:30 deutscher Zeit

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Radar-Update ausführen
        run: python update_radar.py

      - name: Ergebnisse committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar-vorschlaege.json data/radar-gesehen.json data/last_run.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Themenradar: automatische Aktualisierung"
            git push
          fi
