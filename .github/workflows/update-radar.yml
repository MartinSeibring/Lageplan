name: Themenradar aktualisieren

on:
  workflow_dispatch:        # manuell oder per Button aus der App
  schedule:
    - cron: '30 4 * * 1-5'  # werktags 05:30 MEZ / 06:30 MESZ

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig auf demselben Branch (Cron + manueller Klick)
concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Radar-Update ausführen
        run: python update_radar.py

      - name: Ergebnisse committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar-vorschlaege.json data/radar-gesehen.json data/last_run.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Themenradar: automatische Aktualisierung"
            # Paralleler Push (App-Sync) darf den Lauf nicht scheitern lassen
            for i in 1 2 3; do
              git push && break
              echo "Push fehlgeschlagen – rebase und erneut (Versuch $i)"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep 3
            done
          fi
